  zh: 身為執行經理，面對大多各有缺點的罪人，您或許會感到困惑和無力。然而請放心，該罪人是能夠不加抱怨地執行各種命令的少數類型之一。由於該罪人能做出合理的判斷，因此若您想要尋求建議，看向她並開啟話題也是一個好辦法。但請記住，她是從那片深遠且廣闊的水域中歷經艱難旅途得以生還的罪人，故而其忍耐力可以說是深不見底，然而，一旦與她開始走向歧途，要恢復關係可能就十分困難了。
