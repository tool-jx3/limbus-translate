    變成血袋的W公司員工比其他血袋還要棘手。

    打倒他們時，總會掉落奇形怪狀的裝備。

    那是在W公司人格中看過的——W公司護手。

    「血肉沾黏在一起，就這樣使用有些困難。」

    要使用這件裝備的話，似乎得花上一些時間……
