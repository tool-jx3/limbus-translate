# 良秀有兩種唸法：KR 寫 요시히데（本名的唸法）的劇情台詞，良秀加上
# <ruby=Yoshihide>良秀</ruby>（guides/base.md「ruby（劇情與其他檔案）」）。
# 在 story-ruby-parens 之後套用；已經在 ruby 裡的良秀（前一個字是 >）不再加。
# kr_pattern 要求 요시히데 前後還有別的字，所以只有說話者名稱 요시히데 的
# teller 不會被改（說話者名稱不加 ruby）。
reason: KR 寫 요시히데 的劇情台詞，良秀寫成 <ruby=Yoshihide>良秀</ruby>
files: [StoryData/**]
pattern: '(^|[^>])良秀'
replace: '${1}<ruby=Yoshihide>良秀</ruby>'
kr_pattern: '요시히데.|.요시히데'
