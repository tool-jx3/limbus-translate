# 劇情檔在遊戲裡的順序。網頁同一個類別裡的檔照這個順序排；這裡沒列的檔排在已列的之後，照檔名。
# 一組是一章、一個活動或一個角色的人格故事；組的先後就是順序（類別仍由 guides/routing.yaml 決定）。
# 網頁的目錄也照組來分：section 是上一層，組名是 title 指到的語言包文字（file 的 dataList 裡 id 那一筆的
# fields，以空格相接；譯文沒有就用 KR），沒有 title 就用 label。chapter 是主線的章號：章節篩選用它，
# 組名前面也會加上「第 N 章」。
#
# 這個檔是產生的，不要手改：遊戲更新後照
# docs/research/2026-11-15-game-text-logic/method/README.md 的「劇情檔的順序」重新產生。
# 依據是遊戲靜態資料的劇情劇場清單與載入設定（研究報告 11-story-order.md）；
# 標「推定」的檔兩者都沒列，是照檔名插進同一章的（同一編號 B → I → A）。
groups:
  - id: main-100
    section: 主線
    chapter: 0
    title: { file: StoryTheaterMain.json, id: 'CHAPTER_100', fields: [title] }
    files:
