# 不採用的規則建議
#
# `lct suggest` 為每個規則建議產生穩定的 id（種類與格式見 spec §11.2）。規則 PR 中不要的項目，
# 在合併前移到這裡，`lct suggest` 就不再提出；關閉而未合併的規則 PR 中的項目也視為不採用，
# 不用記在這裡。
#
# 格式：清單，每筆
#   id      建議的 id，例如 speaker/아무개、term/전용 파편
#   reason  不採用的理由（必填）
#   date    YYYY-MM-DD
#
#   - id: speaker/아무개
#     reason: 路人，不需要指引
#     date: 2026-11-05
[]
