# 已確認的檢查警告
#
# 審閱頁上確認「沒問題」的檢查警告記在這裡，`lct check` 與審閱頁不再把它當作待處理。
# 由 `lct accept` 附加，也可以手動新增。
#
# 格式：清單，每筆
#   id      警告的 id：warning/<代碼>/<原文 sha8>/<譯文 sha8>
#   reason  確認的理由（必填）
#   date    YYYY-MM-DD
#
# id 含譯文的雜湊：譯文改了，id 就變，警告會再出現，需要重新確認。
#
#   - id: "warning/kana/0123abcd/89ef4567"
#     reason: 日文假名是刻意保留的
#     date: 2026-11-05
