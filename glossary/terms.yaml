- kr: 시즌
  jp: シーズン  # 原指引寫「シーズ」，依官方 JP 應為「シーズン」
  en: Season
  zh: 賽季
  forbidden: ["re:第\\d+季"]
  not_files: ["BattleAnnouncerDlg/**", "PersonalityVoiceDlg/**", "RPGSystem/**", "StoryData/**", "group:ActionEvents", "group:AbEvents"]
  status: approved
  category: [system]
  evidence: { kr_lines: 528, approved: 465, forbidden: 0 }
  notes: 原指引禁用「第Y季」；「第8賽季」這類帶「賽」字的寫法在既有譯文中常見，不算違規。這是系統用語，只用於介面與系統文字；劇情（StoryData、RPG 對話）、語音與播報中指故事內的季節或時尚季時寫「季」：이번 시즌 → 本季／這一季、다음 시즌 → 下一季、몇 시즌 → 幾季、시즌 마감／시즌 오프 → 季末；不寫「季度」（季度是財務季）；數季節的怪量詞照 KR 保留（`아홉그루 시즌` → 九棵季、`두 마리 시즌` → 兩隻季，EN 也保留）。2026-11-06 依實際譯文：BattleAnnouncerDlg、PersonalityVoiceDlg、RPGSystem、StoryData 等播報、語音、RPG 與劇情檔不用此譯名（109 句 0 句用），排除。2026-11-07 依詞義另排除鏡牢與異想體事件的敘述（group:ActionEvents 3 句、group:AbEvents 2 句，0 句用）：都是百貨公司的時尚季（「이번 시즌 신상」這一季的新品），寫「季」
  meaning: "作為遊戲的分期時，指每期約 4 至 7 個月的單位，各有專屬的人格與 E.G.O，以及對應的劇情章節、通行證、折射軌道與活動。"
  sources: ["https://limbuscompany.wiki.gg/wiki/Seasons"]

