  en: only Shard
  zh: 專用碎片
  status: candidate
  forbidden: [人格碎片]
  category: [system]
  evidence: { kr_lines: 7, approved: 0, forbidden: 7 }
  notes: >-
    例：시즌 8 동기화 · 환상해석 전용 파편 (공용) → 第8賽季同步・異想解析專用碎片（共通）。
    KR／JP／EN 都沒有「人格」，既有譯文的「專用人格碎片」多加了字，又與「자아 파편」的禁用譯法相同。
    既有譯文的連接符號「&」「＆」混用，KR 為「·」，需另定一種
