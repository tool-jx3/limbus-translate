name: rebuild

# Builds the pack again when the rules change on main, or by hand, from the raw
# and tw branches that are pushed: it asks for no game update. The pipeline
# translates what the new rules left pending and releases what changed.
on:
  push:
    branches: [main]
    paths: ['rules/**', 'glossary/**', 'guides/**', 'lct.yaml']
  workflow_dispatch:
    inputs:
      requeue:
        description: 'A pack file name or glob (such as StoryData/S1*) whose translations go back to the pending list'
        type: string
        default: ''
      max_usd:
        description: 'Spend at most this many US dollars on translating (empty: the variable LCT_MAX_USD, else 30)'
        type: string
        default: ''
      dry_run:
        description: 'Do not translate; plan, build and release what there is'
        type: boolean
        default: false

jobs:
  rebuild:
    uses: ./.github/workflows/pipeline.yml
    permissions: { contents: write, issues: write }
    with:
      fetch: false
      requeue: ${{ inputs.requeue }}
      max_usd: ${{ inputs.max_usd }}
      dry_run: ${{ inputs.dry_run == true }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
