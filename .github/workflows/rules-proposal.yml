name: rules-proposal

# After an update or a rebuild that ended green, the rules-review skill turns
# what the build found (lct suggest) into changes to guides/, glossary/ and
# rules/ and opens the rules PR, or adds the new suggestions to the one that is
# open (spec 11.2). A person reviews the PR; main is never pushed to. The run
# ends before the action when there is nothing new to suggest.
on:
  workflow_run:
    workflows: [update, rebuild]
    types: [completed]
  workflow_dispatch:

jobs:
  propose:
    # A run of update or rebuild starts this workflow whatever it ended in;
    # only a green one has a build to learn from.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # One run at a time. A run that waits is never cancelled by the next.
    concurrency: { group: rules-proposal, cancel-in-progress: false }
    permissions: { contents: write, pull-requests: write, issues: write, id-token: write }
    defaults:
      run:
        shell: bash
    steps:
      # The whole history: the rules PR is made from origin/main, and
      # lct impact compares with it. The token of the checkout is not kept in
      # .git/config: the action reads text that anyone can write (the game's,
      # the translator's notes), and must not find a token there. The steps
      # before the action fetch without one, which a public repo allows; the
      # action sets up the credentials it pushes with.
      - name: Check out main with its history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # lct suggest and lct impact read the raw and tw worktrees.
      - name: Fetch the raw and tw branches, add their worktrees
        run: |
          git fetch origin '+refs/heads/raw:refs/remotes/origin/raw' '+refs/heads/tw:refs/remotes/origin/tw'
          git worktree add .work/raw raw
          git worktree add .work/tw tw

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build lct
        run: go build -o bin/lct ./cmd/lct

      - name: Set the git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Checks out the branch the suggestions go on (that of the open rules PR,
      # brought up to date, or a new one made from origin/main) and writes
      # work/proposal/exclude.txt, the ids that are in a PR already, were
      # declined or are handled, and work/proposal/existing-body.md, the
      # description of the open PR.
      - name: Choose the branch of the rules PR
        id: start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started=$(bin/lct proposal start --date "$(date -u +%F)" --json)
          branch=$(jq -er .branch <<<"$started")
          pr=$(jq -er .pr <<<"$started")
          if [ "$pr" -eq 0 ]; then
            echo "$branch: no rules PR is open"
          else
            echo "$branch: the open rules PR #$pr gets the new suggestions"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # The run ends here when every suggestion is in a PR, declined or handled.
      - name: Count the suggestions that no rules PR has yet
        id: suggest
        run: |
          suggest=$(bin/lct suggest --json --exclude-file work/proposal/exclude.txt)
          count=$(jq -er '.suggestions | length' <<<"$suggest")
          echo "$count new suggestion(s)"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo '沒有新的規則建議，這次不開也不更新規則 PR。' >> "$GITHUB_STEP_SUMMARY"
          fi

      # The skill edits the rules and publishes the PR with lct proposal
      # publish, so its tools are those of its allowed-tools (the contract test
      # compares the two); the folder of git is closed to it. The model comes
      # from the variable. The action brings its own GitHub credentials (the
      # Claude GitHub App, through id-token), so it gets no token: a PR opened
      # by github-actions would not start ci.yml.
      - name: Review the suggestions, open or update the rules PR
        if: steps.suggest.outputs.count != '0'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/rules-review"
          claude_args: >-
            --model ${{ vars.LCT_MODEL }}
            --max-turns 80
            --allowedTools "Bash(bin/lct suggest *),Bash(bin/lct search *),Bash(bin/lct glossary derive*),Bash(bin/lct adjust tidy*),Bash(bin/lct requeue --to-file *),Bash(bin/lct rules lint*),Bash(bin/lct impact *),Bash(bin/lct proposal publish *),Bash(go build -o bin/lct ./cmd/lct),Read(./**),Edit(./guides/**),Edit(./glossary/**),Edit(./rules/**),Edit(./work/**)"
            --disallowedTools "Read(./.git/**)"

      # What the skill says it did (work/proposal/outcome.txt) decides what is
      # checked. When lct proposal publish refuses, the action does not fail:
      # the model sees the exit status and ends. And a rules PR that is open and
      # waits for review is the usual state, so finding it proves nothing. A run
      # that says it published must have left a suggestion in the PR that the
      # PR did not have when the run began (work/proposal/exclude.txt); one that
      # proposed nothing says so in a notice and stays green; anything else is an
      # error. The PR is looked up by its branch: the label goes through the
      # search index, which lags behind a PR that was just opened.
      - name: Check what the run did and show the rules PR
        if: steps.suggest.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.start.outputs.branch }}
        run: |
          outcome_file=work/proposal/outcome.txt
          if [ ! -f "$outcome_file" ]; then
            echo "::error::the rules-review run left no $outcome_file: it ended without saying what it did; see the log of the step before"
            exit 1
          fi
          outcome=$(tr -d '\r' < "$outcome_file")
          case "$outcome" in
            published) ;;
            'nothing: '*)
              reason=$(head -n 1 <<<"${outcome#nothing: }")
              reason=${reason:0:300}
              echo "::notice::the rules-review run proposed nothing: $reason"
              echo "這次沒有提出規則建議：$reason" >> "$GITHUB_STEP_SUMMARY"
              exit 0 ;;
            *)
              echo "::error::$outcome_file says neither published nor nothing: $(head -n 1 <<<"$outcome" | cut -c1-300)"
              exit 1 ;;
          esac
          prs=$(gh pr list --state open --head "$BRANCH" --json url,body,isCrossRepository)
          url=$(jq -r '[.[] | select(.isCrossRepository | not)] | .[0].url // empty' <<<"$prs")
          if [ -z "$url" ]; then
            echo "::error::the run says it published, but there is no open rules PR from $BRANCH"
            exit 1
          fi
          description=$(jq -r '[.[] | select(.isCrossRepository | not)] | .[0].body // empty' <<<"$prs" | tr -d '\r')
          new=0
          while IFS= read -r line; do
            case "$line" in
              '<!-- suggestion:'*' -->')
                id=${line#'<!-- suggestion:'}
                id=${id%' -->'}
                if [ -n "$id" ] && ! grep -qxF -- "$id" work/proposal/exclude.txt; then
                  new=$((new + 1))
                fi ;;
            esac
          done <<<"$description"
          if [ "$new" -eq 0 ]; then
            echo "::error::the run says it published, but the rules PR $url holds no suggestion that it did not have before the run: this run added nothing"
            exit 1
          fi
          echo "規則 PR：$url（這次新增 $new 個建議）"
          echo "規則 PR：$url（這次新增 $new 個建議）" >> "$GITHUB_STEP_SUMMARY"
