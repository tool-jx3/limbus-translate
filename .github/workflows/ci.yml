name: ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      # The whole history: a pull request that changes the rules is compared
      # with its base branch and the merge base of the two.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build lct
        run: go build -o bin/lct ./cmd/lct
      - name: Lint the rule files
        run: bin/lct rules lint

      # A pull request that changes guides/, glossary/ or rules/ says how many
      # of the translations there are now the new rules would reject and the
      # rules of the base branch do not (spec 11.2). Finding some is no failure:
      # a rule that forbids a wording is meant to flag the translations that use
      # it. The name of the base branch comes through env, not through the
      # script.
      - name: Count the translations the rule changes would break
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD" -- guides glossary rules)
          if [ -z "$changed" ]; then
            echo 'This pull request changes no rule: nothing to assess.'
            exit 0
          fi
          git fetch origin '+refs/heads/raw:refs/remotes/origin/raw' '+refs/heads/tw:refs/remotes/origin/tw'
          git worktree add .work/raw raw
          git worktree add .work/tw tw
          mkdir -p out
          bin/lct impact --base "origin/$BASE_REF" --markdown out/impact.md
          cat out/impact.md >> "$GITHUB_STEP_SUMMARY"

  # The viewer (site/): the type check, the tests and the build. Only the tests
  # read data, the small fixtures of site/fixtures (no raw or tw worktree); the
  # build here has no data and shows only that the code compiles. pages.yml
  # builds it again with the real data and deploys it. A step that fails fails
  # the job.
  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install the packages
        run: npm ci
        working-directory: site
      - name: Type check
        run: npm run typecheck
        working-directory: site
      - name: Test
        run: npm test
        working-directory: site
      - name: Build
        run: npm run build
        working-directory: site
